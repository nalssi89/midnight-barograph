<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="태풍이 지나간 외딴 섬 기상관측소의 살인사건을 푸는 three.js 머더 미스터리 보드게임">
<title>자정의 기압계</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D 보드가 화면을 채우고, 오른쪽(모바일은 아래) 조사 패널이 붙는 2단 구성. 문서·단서는 기압계 기록지 같은 종이 카드로 띄운다. */
:root {
  --night: #0a1418;      /* 태풍 밤하늘 */
  --deck: #11202590;     /* 반투명 패널 */
  --panel: #112025;
  --raise: #172b31;
  --line: #29424a;
  --fg: #e4ebe8;
  --muted: #8ea3a3;
  --signal: #f2a93b;     /* 태풍 특보 황색 */
  --signal-ink: #1b1305;
  --violet: #6b4fc8;     /* 기압계 잉크 */
  --violet-soft: #a796e8;
  --paper: #efeee4;
  --paper-grid: #d9d3ec;
  --paper-ink: #1d2321;
  --paper-muted: #5c625f;
  --danger: #e5604f;
  --ok: #7fcf9a;
  --display: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "D2Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--night); color: var(--fg); font-family: var(--body);
  font-size: 15px; line-height: 1.6; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 392px; }
#stage { position: relative; min-width: 0; overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; touch-action: none; }
#panel {
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
  padding-block: 14px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 14px;
}
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42% minmax(0, 1fr); }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  #hud .wx, #log { display: none; }
  .clock { font-size: 20px; }
  #toast { top: auto; bottom: 10px; font-size: 13px; padding: 8px 12px; }
}

/* HUD */
#hud {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; pointer-events: none;
}
.hud-box {
  background: var(--deck); backdrop-filter: blur(6px); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 12px; pointer-events: auto;
}
.clock { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; letter-spacing: .06em; }
.ticks { display: flex; gap: 3px; margin-top: 8px; }
.ticks i { width: 12px; height: 5px; background: var(--line); border-radius: 1px; }
.ticks i.past { background: var(--muted); }
.ticks i.now { background: var(--signal); }
.wx { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.5; font-variant-numeric: tabular-nums; }
.wx b { color: var(--fg); font-weight: 500; }
.wx .warn { color: var(--signal); }
#log {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: min(440px, calc(100% - 24px));
  display: flex; flex-direction: column; gap: 4px; pointer-events: none;
}
#log div { background: var(--deck); border-left: 2px solid var(--line); padding: 3px 10px; font-size: 12.5px; color: var(--muted); border-radius: 0 4px 4px 0; }
#log div:last-child { color: var(--fg); border-left-color: var(--signal); }
#toast {
  position: absolute; left: 50%; top: 84px; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px));
  background: var(--signal); color: var(--signal-ink); padding: 10px 16px; border-radius: 6px; font-weight: 500;
  box-shadow: 0 8px 30px #0008; opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 14px;
}
#toast.show { opacity: 1; }
#sfx {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; font: 500 12px var(--mono); letter-spacing: .04em; color: var(--fg);
  background: var(--deck); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer;
}
#sfx[aria-pressed="false"] { color: var(--muted); }
.no3d #sfx { display: none; }
/* 타이틀 화면 뒤로 폭풍 속 관측소가 비쳐 보이게 */
body:has(#title:not([hidden])) #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
body:has(#title:not([hidden])) #panel, body:has(#title:not([hidden])) #hud, body:has(#title:not([hidden])) #log { display: none; }
.no3d #scene { display: none; }
.no3d-note { display: none; }
.no3d .no3d-note { display: grid; place-items: center; height: 100%; color: var(--muted); padding: 24px; text-align: center; }

/* Panel */
.who { display: flex; align-items: center; gap: 10px; }
.chip { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px #0006; }
.who-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap { display: flex; gap: 4px; }
.ap i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--signal); }
.ap i.on { background: var(--signal); }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.room h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 2px 0 6px; line-height: 1.25; }
.room p { margin: 0; color: var(--muted); font-size: 13.5px; }
.btn {
  border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 9px 12px;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center; transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn .cost { font-family: var(--mono); font-size: 11px; opacity: .75; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > .btn { flex: 1 1 auto; }
.people { display: grid; gap: 6px; }
.person {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; text-align: left;
}
.person:hover:not(:disabled) { border-color: var(--muted); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 15px; color: #10181a;
}
.person .nm { font-weight: 600; font-size: 14px; }
.person .rl { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }
.map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.cell {
  position: relative; min-height: 58px; border-radius: 5px; border: 1px solid var(--line); background: #0d1a1e;
  padding: 6px 7px; text-align: left; font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; justify-content: space-between;
}
.cell.adj { border-color: #5d7a7f; background: #13262b; }
.cell.adj:hover { border-color: var(--signal); }
.cell.here { border-color: var(--signal); background: #2a2414; }
.cell.locked { opacity: .45; }
.cell .dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.cell .dots i { width: 8px; height: 8px; border-radius: 50%; }
.cell .dots i.pl { border-radius: 2px; transform: rotate(45deg); width: 7px; height: 7px; }
.foot { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.foot .btn.wide { grid-column: 1 / -1; }

/* Modals */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #050a0cd9; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.sheet {
  width: min(680px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 22px; position: relative;
  animation: rise .25s ease-out;
}
.sheet.wide { width: min(940px, 100%); }
@keyframes rise { from { transform: translateY(10px); opacity: .0; } to { transform: none; opacity: 1; } }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0 0 10px; line-height: 1.25; }
.sheet > .card:first-of-type { margin-top: 30px; }
.sheet .x { z-index: 3; position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); font-size: 18px; line-height: 1; }
.prose p { margin: 0 0 12px; max-width: 62ch; }
.prose p.lead { font-family: var(--display); font-size: 18px; line-height: 1.7; font-weight: 700; }

/* Clue card: 기록지 종이 */
.card {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 18px 20px 20px;
  background-image:
    linear-gradient(var(--paper-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
  background-size: 100% 26px, 26px 100%; background-position: 0 -1px, -1px 0;
  box-shadow: 0 1px 0 #fff8 inset, 0 12px 32px #0007; position: relative;
}
.card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#efeee4f0, #efeee4e6); border-radius: 4px; pointer-events: none; }
.card > * { position: relative; }
.card header { display: flex; gap: 10px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; color: var(--paper-muted); border-bottom: 1.5px solid var(--paper-ink); padding-bottom: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.card header .kind { color: #fff; background: var(--paper-ink); padding: 1px 7px; border-radius: 2px; letter-spacing: .06em; }
.card.k-rec header .kind { background: var(--violet); }
.card.k-obj header .kind { background: #a8641c; }
.card.k-doc header .kind { background: #2f6a6e; }
.card header .loc { margin-left: auto; }
.card h3 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 0 0 10px; line-height: 1.3; }
.card .body p { margin: 0 0 10px; }
.card .body p:last-child { margin-bottom: 0; }
.card .quote { font-family: var(--display); font-weight: 700; border-left: 3px solid var(--violet); padding: 4px 0 4px 12px; margin: 8px 0 12px; }
.card .hand { font-family: var(--display); font-weight: 700; color: #3a2f86; }
.card .chart { margin: 6px 0 12px; overflow-x: auto; }
.card .chart svg { display: block; width: 100%; min-width: 480px; height: auto; }
.tbl-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.data { border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; width: 100%; min-width: 420px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #c8c6ba; vertical-align: top; }
table.data th { font-weight: 500; color: var(--paper-muted); font-size: 11px; letter-spacing: .06em; }
table.data tr.hl td { background: #e7dff9; }

/* Interrogation */
.q-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; padding-right: 40px; }
.q-head .avatar { width: 54px; height: 54px; font-size: 22px; }
.q-head h2 { margin: 0; }
.q-head .rl { color: var(--muted); font-size: 13px; }
.topics { display: grid; gap: 8px; margin-top: 12px; }
.topic { text-align: left; border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 10px 12px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.topic:hover:not(:disabled) { border-color: var(--signal); }
.topic:disabled { opacity: .45; cursor: not-allowed; }
.said { border-left: 2px solid var(--line); padding: 2px 0 2px 14px; margin: 0 0 14px; }
.said .q { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.said .a { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.75; }
.said.new { border-left-color: var(--signal); }
.said .a em { font-family: var(--body); font-weight: 400; font-style: normal; color: var(--muted); font-size: 13.5px; }
.locked-note { color: var(--muted); font-size: 13px; margin-top: 10px; }

/* Notebook */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; padding-right: 40px; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.tab.on { background: var(--fg); color: var(--night); border-color: var(--fg); font-weight: 600; }
.list { display: grid; gap: 8px; }
.item { text-align: left; border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 9px 12px; display: grid; gap: 2px; }
.item:hover { border-color: var(--muted); }
.item .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.profile { border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.profile .avatar { width: 44px; height: 44px; font-size: 18px; }
.profile h4 { margin: 0; font-size: 15px; }
.profile p { margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.profile.victim { grid-column: 1 / -1; border-color: #5b3b36; background: #1d1a1a; }
textarea.memo { width: 100%; min-height: 220px; background: #0c181b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; resize: vertical; }

/* Accusation */
.acc fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin: 0 0 12px; }
.acc legend { padding: 0 6px; font-weight: 600; }
.opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.opt { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: 14px; background: var(--raise); }
.opt:has(input:checked) { border-color: var(--signal); background: #2a2414; }
.opt input { margin-top: 4px; accent-color: var(--signal); }
.warnbox { border: 1px solid var(--signal); color: var(--signal); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; margin: 6px 0 14px; }

/* Title */
#title {
  position: fixed; inset: 0; z-index: 40; background: linear-gradient(100deg, rgba(10,20,24,.94) 0%, rgba(10,20,24,.82) 48%, rgba(10,20,24,.42) 100%); overflow-y: auto;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.t-wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 28px; }
.t-head { position: relative; padding-top: 4vh; }
.t-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.t-meta b { color: var(--signal); font-weight: 500; }
.t-title { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 11vw, 112px); line-height: 1.02; margin: 14px 0 6px; letter-spacing: -.02em; }
.t-sub { font-family: var(--display); font-weight: 700; font-size: clamp(17px, 2.6vw, 22px); color: var(--muted); margin: 0; }
.t-baro { width: 100%; height: auto; display: block; margin-top: 18px; }
.t-baro .trace { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: pen 5.5s ease-out .3s forwards; }
@keyframes pen { to { stroke-dashoffset: 0; } }
.t-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .t-grid { grid-template-columns: minmax(0, 1fr); } }
.t-hook p { margin: 0 0 12px; max-width: 60ch; color: #c7d2cf; }
.setup { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 7px 14px; font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--fg); color: var(--night); border-color: var(--fg); font-weight: 600; }
.names { display: grid; gap: 6px; }
.names label { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: center; }
.names input { background: #0c181b; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--fg); font: inherit; width: 100%; }
.t-foot { color: var(--muted); font-size: 12.5px; padding-bottom: 20px; }

/* Ending */
.end h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 54px); margin: 0 0 6px; line-height: 1.15; }
.grade { display: inline-flex; align-items: baseline; gap: 10px; border: 1px solid var(--signal); color: var(--signal); border-radius: 6px; padding: 6px 14px; font-family: var(--mono); margin: 6px 0 14px; }
.grade b { font-size: 26px; }
.timeline { list-style: none; padding: 0; margin: 10px 0 18px; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.timeline li time { font-family: var(--mono); color: var(--violet-soft); font-variant-numeric: tabular-nums; }
.timeline li.key time { color: var(--signal); }
.confess { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.85; border-left: 3px solid var(--violet); padding-left: 16px; margin: 16px 0; }
.confess p { margin: 0 0 12px; }
.answers td.ok { color: var(--ok); }
.answers td.no { color: var(--danger); }
table.answers { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13.5px; }
table.answers th, table.answers td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
table.answers th { color: var(--muted); font-weight: 500; font-size: 12px; }
.handoff { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 10px 0; }
.handoff .big { font-family: var(--display); font-weight: 800; font-size: 30px; }
.safe-in { font-family: var(--mono); font-size: 32px; letter-spacing: .5em; text-align: center; width: 230px; padding: 10px; background: #0c181b; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } .t-baro .trace { stroke-dashoffset: 0; } }
</style>

<div id="app">
  <section id="stage" aria-label="가랑도 관측소 3D 보드">
    <canvas id="scene"></canvas>
    <div class="no3d-note">3D 보드를 불러오지 못했다. 오른쪽 패널의 평면도로 계속 플레이할 수 있다.</div>
    <div id="hud"></div>
    <div id="log" aria-live="polite"></div>
    <div id="toast" role="status"></div>
    <button id="sfx" type="button" aria-pressed="true" title="빗소리·바람·천둥 환경음">♪ 소리 켬</button>
  </section>
  <aside id="panel" aria-label="조사 패널"></aside>
</div>

const BARO_PTS = [[0,986.0],[60,983.1],[120,979.0],[180,973.2],[240,965.4],[300,956.0],[330,950.8],[350,947.6],[368,946.1],[391,945.8],[412,946.2],[430,950.5],[450,955.9],[480,962.0],[540,970.8],[600,976.5],[660,980.2],[720,982.9]];
function baroAt(t) {
  for (let i = 1; i < BARO_PTS.length; i++) {
    const [t0, p0] = BARO_PTS[i - 1], [t1, p1] = BARO_PTS[i];
    if (t <= t1) return p0 + (p1 - p0) * (t - t0) / (t1 - t0);
  }
  return BARO_PTS[BARO_PTS.length - 1][1];
}
function baroPath(x0, y0, w, h, pMin, pMax) {
  let d = "";
  for (let t = 0; t <= 720; t += 3) {
    const wob = Math.sin(t * 0.37) * 0.12 + Math.sin(t * 1.9) * 0.06;
    const p = baroAt(t) + wob;
    const x = x0 + (t / 720) * w, y = y0 + (1 - (p - pMin) / (pMax - pMin)) * h;
    d += (t ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d;
}
function baroSVG() {
  const X = 56, Y = 18, W = 480, H = 190, pMin = 940, pMax = 990;
  let g = "";
  for (let p = pMin; p <= pMax; p += 5) {
    const y = Y + (1 - (p - pMin) / (pMax - pMin)) * H;
    g += `<line x1="${X}" x2="${X + W}" y1="${y}" y2="${y}" stroke="#b9acdf" stroke-width="${p % 10 ? 0.5 : 1}"/>`;
    if (p % 10 === 0) g += `<text x="${X - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5c625f">${p}</text>`;
  }
  const hours = ["18","19","20","21","22","23","00","01","02","03","04","05","06"];
  hours.forEach((hh, i) => {
    const x = X + (i / 12) * W;
    // 기압계 펜 팔이 원호를 그리므로 시간선도 휘어 있다
    g += `<path d="M${x} ${Y} Q${x - 9} ${Y + H / 2} ${x} ${Y + H}" fill="none" stroke="#b9acdf" stroke-width="${i % 6 ? 0.6 : 1.2}"/>`;
    g += `<text x="${x}" y="${Y + H + 16}" text-anchor="middle" font-size="11" fill="#5c625f">${hh}</text>`;
  });
  const x1 = X + (368 / 720) * W, x2 = X + (412 / 720) * W;
  g += `<rect x="${x1}" y="${Y}" width="${x2 - x1}" height="${H}" fill="#6b4fc8" opacity="0.08"/>`;
  g += `<path d="${baroPath(X, Y, W, H, pMin, pMax)}" fill="none" stroke="#4b31a8" stroke-width="1.8" stroke-linejoin="round"/>`;
  const yMin = Y + (1 - (945.8 - pMin) / (pMax - pMin)) * H;
  g += `<text x="${(x1 + x2) / 2}" y="${yMin + 18}" text-anchor="middle" font-size="10.5" fill="#4b31a8">945.8</text>`;
  return `<svg viewBox="0 0 560 238" role="img" aria-label="9월 17일 18시부터 18일 06시까지 기압 기록. 00시 08분부터 00시 52분까지 945.8hPa 부근에서 평평하다." font-family="IBM Plex Mono, monospace">
    <rect x="0" y="0" width="560" height="238" fill="#f4f2fb"/>${g}
    <text x="${X}" y="12" font-size="10.5" fill="#5c625f">hPa · 자기기압계 · 가랑도 · 9/17 18시 → 9/18 06시</text></svg>`;
}
const AWS = [["23:00","남동",39.0],["23:10","남동",42.1],["23:20","남동",44.0],["23:30","남동",45.8],["23:40","남동",46.3],["23:50","남동",41.2],["00:00","남동",28.4],["00:10","동",6.1],["00:20","—",3.2],["00:30","—",2.1],["00:40","—",2.6],["00:50","서",9.8],["01:00","북서",34.7],["01:10","북서",41.5],["01:20","북서",43.0],["01:30","북서",40.2]];
function awsSVG() {
  const X = 40, Y = 16, W = 500, H = 160, max = 50, bw = W / AWS.length;
  let g = "";
  for (let v = 0; v <= max; v += 10) {
    const y = Y + H - (v / max) * H;
    g += `<line x1="${X}" x2="${X + W}" y1="${y}" y2="${y}" stroke="#cfcab9" stroke-width="0.7"/><text x="${X - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#5c625f">${v}</text>`;
  }
  AWS.forEach(([t, d, v], i) => {
    const h = (v / max) * H, x = X + i * bw + 3;
    const col = d === "남동" ? "#a8641c" : d === "북서" ? "#2f6a6e" : "#8a8f8b";
    g += `<rect x="${x}" y="${Y + H - h}" width="${bw - 6}" height="${h}" fill="${col}"/>`;
    g += `<text x="${x + (bw - 6) / 2}" y="${Y + H - h - 4}" text-anchor="middle" font-size="9" fill="#1d2321">${v.toFixed(1)}</text>`;
    if (i % 2 === 0) g += `<text x="${x + (bw - 6) / 2}" y="${Y + H + 14}" text-anchor="middle" font-size="10" fill="#5c625f">${t}</text>`;
    g += `<text x="${x + (bw - 6) / 2}" y="${Y + H + 28}" text-anchor="middle" font-size="9.5" fill="${col}">${d}</text>`;

}

/* ---------- 상태 ---------- */
const state = { players: [], round: 0, turn: 0, apMax: 3, phase: "title", disposed: false, log: [], winners: [], finalQueue: [], solvedRound: null };
const cur = () => state.players[state.turn];
const active = () => state.players.filter(p => !p.out);
const multi = () => state.players.length > 1;
function meets(p, def) {
  return (def.req || []).every(k => p.know.has(k)) && (!def.any || def.any.some(k => p.know.has(k)));
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const suspectRoom = (s, r = state.round) => s.sched[Math.min(r, ROUNDS - 1)];

/* ---------- UI 유틸 ---------- */
const $ = id => document.getElementById(id);
let modalClosable = true, modalOnClose = null;
function openModal(html, { closable = true, wide = false, onClose = null } = {}) {
  const m = $("modal");
  modalClosable = closable; modalOnClose = onClose;
  m.innerHTML = `<div class="sheet${wide ? " wide" : ""}" role="dialog" aria-modal="true">${closable ? `<button class="x" id="modal-x" aria-label="닫기">×</button>` : ""}${html}</div>`;
  m.hidden = false;
  if (closable) $("modal-x").onclick = closeModal;
  m.onclick = e => { if (e.target === m && modalClosable) closeModal(); };
  const f = m.querySelector("button:not(.x), input"); if (f) f.focus({ preventScroll: true });
}
function closeModal() {
  $("modal").hidden = true; $("modal").innerHTML = "";
  const cb = modalOnClose; modalOnClose = null; if (cb) cb();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden && modalClosable) closeModal(); });
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3600); }
function log(msg) { state.log.push(msg); if (state.log.length > 40) state.log.shift(); renderLog(); }
function renderLog() { $("log").innerHTML = state.log.slice(-4).map(m => `<div>${esc(m)}</div>`).join(""); }

function clueCard(c) {
  return `<article class="card k-${c.kind}">
    <header><span>증거 ${CLUE_NO[c.id]}</span><span class="kind">${KIND[c.kind]}</span><span class="loc">${c.room ? ROOMS[c.room].short : c.id === "O3" ? "소장실 금고" : c.id === "LTR" ? "조막례" : "장비실"}</span></header>
    <h3>${c.title}</h3><div class="body">${c.html()}</div></article>`;
}
function avatar(s, size = "") { return `<span class="avatar" style="background:${s.color}" aria-hidden="true">${s.init}</span>`; }

/* ---------- 렌더: HUD/패널 ---------- */
function renderHUD() {
  if (state.phase === "title") { $("hud").innerHTML = ""; return; }
  const r = Math.min(state.round, ROUNDS - 1), [hpa, ws, wd] = WEATHER[r];
  const left = (ROUNDS - state.round) * 30;
  $("hud").innerHTML = `
    <div class="hud-box"><div class="clock">09/18 ${timeOf(r)}<small>헬기 도착까지 ${Math.floor(left / 60)}시간 ${String(left % 60).padStart(2, "0")}분</small></div>
      <div class="ticks" aria-hidden="true">${Array.from({ length: ROUNDS }, (_, i) => `<i class="${i < r ? "past" : i === r ? "now" : ""}"></i>`).join("")}</div></div>
    <div class="hud-box wx">기압 <b>${hpa.toFixed(1)}</b> hPa<br>풍속 <b class="${ws >= 15 ? "warn" : ""}">${ws.toFixed(1)}</b> m/s · ${wd}<br>태풍 가람 · ${ws >= 15 ? '<span class="warn">강풍 특보</span>' : "특보 해제 중"}</div>`;
}

  const p = cur(), room = ROOMS[p.pos];

  const foundHere = roomClues.filter(c => p.know.has(c.id) || (c.id === "E2" && p.know.has("E2x")) || (c.safe && p.know.has("O3"))).length;

    <div><div class="lbl" style="margin-bottom:6px">평면도 · 인접한 방을 눌러 이동 (행동 1)</div>
      <div class="map">${ROOM_IDS.map(id => {
        const R = ROOMS[id], isHere = id === p.pos, adj = adjacent(id, p.pos), locked = id === "field" && state.round < FIELD_OPEN;
        const dots = SUSPECTS.filter(s => suspectRoom(s) === id).map(s => `<i style="background:${s.color}" title="${s.name}"></i>`).join("") +
          state.players.filter(q => !q.out && q.pos === id).map(q => `<i class="pl" style="background:${q.color}" title="${esc(q.name)}"></i>`).join("");
        return `<button class="cell ${isHere ? "here" : ""} ${adj && !locked ? "adj" : ""} ${locked ? "locked" : ""}" data-room="${id}" style="grid-column:${R.col + 1};grid-row:${R.row + 1}" ${!adj || locked || p.ap < 1 ? 'aria-disabled="true"' : ""}>

    <div class="foot">

  $("act-search").onclick = doSearch;

  $("act-end").onclick = endTurn;

function renderAll() { renderHUD(); renderPanel(); sync3D(); }

/* ---------- 행동 ---------- */
function spend(p) { p.ap--; }
function give(p, id) {
  if (p.know.has(id)) return;
  p.know.add(id); p.found.push(id);
  (CLUE[id].sets || []).forEach(k => p.know.add(k));
}
function doSearch() {
  const p = cur(); if (p.ap < 1) return;
  const list = CLUES.filter(c => c.room === p.pos);
  let lockedHint = null;
  for (const c0 of list) {
    let c = c0;
    if (c.id === "E2" && state.disposed && !p.know.has("E2")) c = Object.assign({}, CLUE.E2x, { req: c0.req, hint: c0.hint });
    if (c.safe) {
      if (p.know.has("O3")) continue;
      if (!p.know.has("safe_seen")) { spend(p); p.know.add("safe_seen"); log(`${p.name} 조사관이 ${ROOMS[p.pos].short}을 수색했다.`); renderAll(); openSafe(true); return; }
      continue;
    }
    if (p.know.has(c.id)) continue;
    if (!meets(p, c)) { if (!lockedHint) lockedHint = c.hint; continue; }
    spend(p); give(p, c.id);
    log(`${p.name} 조사관이 ${ROOMS[p.pos].short}을 수색했다.`);
    renderAll();
    openModal(clueCard(CLUE[c.id]) + `<div class="row" style="margin-top:14px"><button class="btn primary" id="ok">수첩에 기록</button></div>`);
    $("ok").onclick = closeModal;
    return;
  }
  openModal(`<h2>더 찾을 것이 보이지 않는다</h2><div class="prose"><p>${lockedHint ? lockedHint : "이 방은 샅샅이 뒤졌다. 다른 곳을 살펴보자."}</p><p class="lbl">행동은 쓰지 않았다.</p></div>`);
}
function openSafe(first) {
  const p = cur();
  openModal(`<h2>벽 금고</h2><div class="prose"><p>${first ? "'하늬' 진로도가 붙은 벽 옆에 작은 벽 금고가 숨어 있다. " : ""}4자리 비밀번호를 입력해야 열린다. 틀려도 행동은 쓰지 않는다.</p></div>
    <form id="safe-f" style="display:grid;justify-items:center;gap:12px;margin-top:8px"><input id="safe-code" class="safe-in" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="금고 비밀번호 4자리"><button class="btn primary" type="submit">열기</button><div id="safe-msg" class="lbl"></div></form>`);
  $("safe-f").onsubmit = e => {
    e.preventDefault();
    const v = $("safe-code").value.trim();
    if (v === SAFE_CODE) {
      give(p, "O3"); log(`${p.name} 조사관이 무언가를 열었다.`); renderAll();
      openModal(`<p class="lbl" style="margin-bottom:10px">찰칵. 금고가 열렸다.</p>` + clueCard(CLUE.O3) + `<div class="row" style="margin-top:14px"><button class="btn primary" id="ok">수첩에 기록</button></div>`);
      $("ok").onclick = closeModal;
    } else {
      const i = $("safe-code"); i.classList.remove("shake"); void i.offsetWidth; i.classList.add("shake");
      $("safe-msg").textContent = "열리지 않는다. 소장에게 '잊으면 안 되는 날'은 언제였을까.";
    }
  };
}
function tryMove(room) {
  const p = cur();
  if (room === p.pos) return;
  if (!adjacent(room, p.pos)) { toast("붙어 있는 방으로만 한 칸씩 이동할 수 있다."); return; }
  if (room === "field" && state.round < FIELD_OPEN) { toast("관측노장은 바람이 잦아드는 09:00부터 나갈 수 있다."); return; }
  if (p.ap < 1) { toast("남은 행동이 없다. 차례를 마치자."); return; }
  spend(p); p.pos = room;
  log(`${p.name} 조사관이 ${ROOMS[room].short}(으)로 이동했다.`);
  renderAll();
}
function openInterrogation(sid, newId) {
  const p = cur(), s = SUS[sid];
  if (suspectRoom(s) !== p.pos) { toast(`${s.name}은(는) 지금 ${ROOMS[suspectRoom(s)].short}에 있다.`); return; }
  const topics = TOPICS[sid];
  const asked = topics.filter(t => p.know.has(`T:${sid}:${t.id}`));
  const avail = topics.filter(t => !p.know.has(`T:${sid}:${t.id}`) && meets(p, t));
  const lockedN = topics.length - asked.length - avail.length;
  openModal(`<div class="q-head">${avatar(s)}<div><h2>${s.name}</h2><div class="rl">${s.role}</div></div></div>
    ${asked.map(t => `<div class="said ${t.id === newId ? "new" : ""}"><div class="q">${t.q}</div><div class="a">${t.a}</div></div>`).join("") || `<p class="empty">${s.profile}</p>`}
    <div class="lbl">질문하기 · 행동 1 · 남은 행동 ${p.ap}</div>
    <div class="topics">${avail.length ? avail.map(t => `<button class="topic" data-t="${t.id}" ${p.ap < 1 ? "disabled" : ""}><span>${t.q}</span><span class="cost lbl">1</span></button>`).join("") : `<p class="empty">지금은 더 물어볼 것이 없다.</p>`}</div>
    ${lockedN ? `<p class="locked-note">단서나 다른 사람의 증언이 더 있으면 물어볼 수 있는 질문이 ${lockedN}개 남아 있다.</p>` : ""}`);
  document.querySelectorAll(".topic").forEach(b => b.onclick = () => ask(sid, b.dataset.t));
  if (newId) { const n = document.querySelector(".said.new"); if (n) n.scrollIntoView({ block: "center" }); }
}
function ask(sid, tid) {
  const p = cur(); if (p.ap < 1) return;
  const t = TOPICS[sid].find(x => x.id === tid);
  spend(p);
  p.know.add(`T:${sid}:${tid}`); p.testi.push(`${sid}:${tid}`);
  (t.sets || []).forEach(k => p.know.add(k));
  log(`${p.name} 조사관이 ${SUS[sid].name}을(를) 심문했다.`);
  renderAll();
  if (t.gives && !p.know.has(t.gives)) {
    give(p, t.gives);
    openModal(`<div class="said new"><div class="q">${t.q}</div><div class="a">${t.a}</div></div>` + clueCard(CLUE[t.gives]) + `<div class="row" style="margin-top:14px"><button class="btn primary" id="ok">수첩에 기록</button></div>`);
    $("ok").onclick = () => openInterrogation(sid);
    renderAll();
    return;
  }
  openInterrogation(sid, tid);
}

/* ---------- 수첩 ---------- */
function openNotebook(tab) {
  const p = cur();
  const tabs = [["clues", `단서 ${p.found.length}`], ["testi", `증언 ${p.testi.length}`], ["people", "인물"], ["memo", "메모"]];
  let body = "";
  if (tab === "clues") {
    body = p.found.length ? `<div class="list">${p.found.map(id => { const c = CLUE[id]; return `<button class="item" data-c="${id}"><span class="meta">증거 ${CLUE_NO[id]} · ${KIND[c.kind]}</span><span>${c.title}</span></button>`; }).join("")}</div>` : `<p class="empty">아직 찾은 단서가 없다. 방을 수색해 보자.</p>`;
  } else if (tab === "testi") {
    body = p.testi.length ? p.testi.map(k => { const [sid, tid] = k.split(":"), t = TOPICS[sid].find(x => x.id === tid); return `<div class="said"><div class="q"><b style="color:${SUS[sid].color}">${SUS[sid].name}</b> · ${t.q}</div><div class="a">${t.a}</div></div>`; }).join("") : `<p class="empty">아직 들은 증언이 없다. 같은 방에 있는 사람을 심문해 보자.</p>`;
  } else if (tab === "people") {
    body = `<div class="profiles"><div class="profile victim"><span class="avatar" style="background:#7b5550">윤</span><div><h4>피해자 · ${VICTIM.name}</h4><p>${VICTIM.info}</p></div></div>
      ${SUSPECTS.map(s => `<div class="profile">${avatar(s)}<div><h4>${s.name} <span style="color:var(--muted);font-weight:400;font-size:12.5px">${s.role}</span></h4><p>${s.profile}</p><p class="lbl" style="margin-top:6px">지금 · ${ROOMS[suspectRoom(s)].short}</p></div></div>`).join("")}</div>`;
  } else {
    body = `<label for="memo-t" class="lbl">${esc(p.name)} 조사관의 메모 · 이 기기에만 남는다</label><textarea id="memo-t" class="memo" placeholder="시간표, 의심 가는 점, 금고 번호 추측…">${esc(p.notes)}</textarea>`;
  }
  const nbClose = () => { saveMemo(); if (state.phase === "final") processFinalResume(); };
  openModal(`<h2>${esc(p.name)} 조사관의 수첩</h2><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}" role="tab" aria-selected="${k === tab}">${l}</button>`).join("")}</div>${body}`, { wide: true, onClose: nbClose });
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { saveMemo(); openNotebook(b.dataset.tab); });
  document.querySelectorAll(".item").forEach(b => b.onclick = () => { openModal(clueCard(CLUE[b.dataset.c]) + `<div class="row" style="margin-top:14px"><button class="btn" id="back">수첩으로</button></div>`, { wide: true, onClose: state.phase === "final" ? processFinalResume : null }); $("back").onclick = () => openNotebook("clues"); });
  if (tab === "memo") { const m = $("memo-t"); m.oninput = saveMemo; }
}
function saveMemo() { const m = $("memo-t"); if (m) cur().notes = m.value; }

function rulesHTML() {

  <p><b>보고서</b>는 조사관마다 한 번만 낼 수 있고, 내면 차례가 끝난다. 범인과 알리바이 트릭을 모두 맞히면 사건 해결. 하나라도 틀리면 그 조사관은 탈락한다. 나머지 항목은 보고서 등급을 정한다.</p>

  <p><b>조작.</b> 3D 보드를 드래그하면 회전, 휠이나 두 손가락으로 확대. 방이나 인물을 눌러 이동하고 심문한다.</p></div>`;
}
function openRules() { openModal(rulesHTML(), { wide: true }); }

/* ---------- 보고서 ---------- */
function openAccuse(final) {
  const p = cur();
  openModal(`<h2>${final ? "헬기가 내렸다. 마지막 보고서" : "사건 보고서 제출"}</h2>
    <div class="warnbox">${final ? "정오다. 지금까지 모은 것으로 결론을 내려야 한다." : "보고서는 한 번만 낼 수 있다. 범인과 알리바이 트릭 중 하나라도 틀리면 이 조사관은 탈락한다."}</div>
    <form id="acc-f" class="acc">${ACCUSE.map(q => `<fieldset><legend>${q.label}</legend><div class="opts">${q.opts.map(([v, l]) => `<label class="opt"><input type="radio" name="${q.id}" id="acc-${q.id}-${v}" value="${v}" required><span>${l}</span></label>`).join("")}</div></fieldset>`).join("")}
    <div class="row"><button class="btn primary" type="submit">보고서 제출</button>${final ? "" : `<button class="btn ghost" type="button" id="acc-cancel">조사 계속하기</button>`}</div></form>`, { wide: true, closable: !final });
  if (!final) $("acc-cancel").onclick = closeModal;
  $("acc-f").onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target), ans = {};
    ACCUSE.forEach(q => ans[q.id] = fd.get(q.id));
    p.answers = ans; p.answerRound = state.round;
    const solved = ans.who === "ksy" && ans.trick === "bcast";
    if (final) { if (solved) state.winners.push(p); else p.out = true; closeModal(); processFinal(); return; }
    if (solved) { state.winners = [p]; state.solvedRound = state.round; closeModal(); endGame(); return; }
    p.out = true;
    log(`${p.name} 조사관의 보고서가 반려되었다.`);
    openModal(`<h2>보고서 반려</h2><div class="prose"><p>수사팀장은 보고서를 끝까지 읽고 고개를 저었다. "이걸로는 아무도 못 잡아."</p><p>${esc(p.name)} 조사관은 이번 사건에서 빠진다.${active().length ? " 남은 조사관에게 기기를 넘기자." : ""}</p></div><div class="row"><button class="btn primary" id="ok">확인</button></div>`, { closable: false });
    $("ok").onclick = () => { closeModal(); if (!active().length) endGame(); else nextTurn(); };
  };
}

/* ---------- 흐름 ---------- */
function onRoundStart() {
  if (state.round === DISPOSE_ROUND) state.disposed = true;
  const ev = ROUND_EVENTS[state.round];
  if (ev) { log(ev); state.pendingEvent = ev; }
}
function beginTurn() {
  const p = cur(); p.ap = state.apMax;
  const ev = state.pendingEvent; state.pendingEvent = null;
  renderAll();
  if (multi()) {
    openModal(`<div class="handoff"><div class="lbl">${timeOf(state.round)} · 라운드 ${state.round + 1}/${ROUNDS}</div><span class="chip" style="background:${p.color};width:22px;height:22px"></span><div class="big">${esc(p.name)} 조사관 차례</div>${ev ? `<p style="max-width:46ch;color:var(--muted)">${ev}</p>` : ""}<p class="lbl">다른 조사관은 화면에서 눈을 떼 주세요</p><button class="btn primary" id="go">수첩 펼치기</button></div>`, { closable: false });
    $("go").onclick = closeModal;
  } else if (ev) toast(ev);
}
function endTurn() {
  if (state.phase !== "play") return;
  closeModal(); nextTurn();
}
function nextTurn() {
  if (!active().length) return endGame();
  let n = state.turn;
  for (let i = 0; i < state.players.length * 2 + 1; i++) {
    n++;
    if (n >= state.players.length) {
      n = 0; state.round++;
      if (state.round >= ROUNDS) return finalPhase();
      onRoundStart();
    }
    if (!state.players[n].out) break;
  }
  state.turn = n; beginTurn();
}
function finalPhase() {
  state.round = ROUNDS; state.phase = "final";
  state.finalQueue = state.players.map((p, i) => i).filter(i => !state.players[i].out);
  renderHUD(); renderPanel(); sync3D();
  log("12:00 · 해경 헬기가 헬리패드에 내렸다.");
  processFinal();
}
function processFinal() {
  if (!state.finalQueue.length) { state.solvedRound = ROUNDS; return endGame(); }
  state.turn = state.finalQueue.shift();
  const p = cur();
  openModal(`<div class="handoff"><div class="lbl">12:00 · 해경 헬기 도착</div><span class="chip" style="background:${p.color};width:22px;height:22px"></span><div class="big">${esc(p.name)} 조사관, 마지막 보고서</div><p style="max-width:46ch;color:var(--muted)">로터 바람에 빗물이 흩날린다. 수사팀장이 손을 내민다.</p><div class="row"><button class="btn" id="nb">수첩 다시 보기</button><button class="btn primary" id="go">보고서 쓰기</button></div></div>`, { closable: false });
  $("go").onclick = () => openAccuse(true);
  $("nb").onclick = () => openNotebook("clues");
}
function processFinalResume() { state.finalQueue.unshift(state.turn); processFinal(); }

function grade(p) {
  const n = ACCUSE.filter(q => p.answers && p.answers[q.id] === q.truth).length;
  const r = p.answerRound ?? ROUNDS;
  if (n === 5 && r <= 6) return ["S", "완벽한 보고서"];
  if (n === 5) return ["A", "빈틈없는 보고서"];
  if (n === 4) return ["B", "핵심을 짚은 보고서"];
  return ["C", "범인은 잡았지만 아쉬운 보고서"];
}
function endGame() {
  state.phase = "end"; renderPanel(); renderHUD(); sync3D();
  const win = state.winners.length > 0;
  const ansTable = state.players.filter(p => p.answers).length ? `<h3 style="font-family:var(--display);font-size:20px;margin:22px 0 8px">제출된 보고서</h3><div class="tbl-wrap"><table class="answers"><thead><tr><th>항목</th><th>진실</th>${state.players.filter(p => p.answers).map(p => `<th style="color:${p.color}">${esc(p.name)}</th>`).join("")}</tr></thead><tbody>
    ${ACCUSE.map(q => `<tr><td>${q.label}</td><td>${q.opts.find(o => o[0] === q.truth)[1]}</td>${state.players.filter(p => p.answers).map(p => { const v = p.answers[q.id], ok = v === q.truth; return `<td class="${ok ? "ok" : "no"}">${ok ? "맞음" : (q.opts.find(o => o[0] === v) || ["", "—"])[1]}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  const winHead = win ? `<div class="lbl">사건 종결 · ${state.solvedRound >= ROUNDS ? "12:00" : timeOf(state.solvedRound)}</div><h1>바람이 멎은 하늘에서</h1>
    ${state.winners.map(p => { const [g, t] = grade(p); return `<div class="grade"><b>${g}</b><span>${esc(p.name)} 조사관 · ${t}</span></div>`; }).join(" ")}
    <div class="prose"><p class="lead">12시 4분, 해경 헬기가 가랑도 헬리패드에 내렸다. 보고서를 다 읽은 수사팀장이 강서윤 앞에 섰다. 그녀는 오래 바다를 보다가 입을 열었다.</p></div>
    <div class="confess">
      <p>그 밤, 저는 서른 살이었어요. 해수면온도 초기장을 하루 전 파일로 넣었다는 걸 새벽 세 시, 재수정 런을 돌리고서야 알았어요. 화면에 서쪽으로 꺾이는 진로가 떴을 때 저는 그게 서포항이라는 걸 알았어요. 그리고 삭제 키를 눌렀어요.</p>
      <p>경보가 늦어진 건 축제 때문이라고, 압력 때문이라고 다들 그렇게 믿었어요. 저도 그렇게 믿기로 했고요. 소장님은 5년 동안 제 몫까지 지고 사셨어요.</p>
      <p>어젯밤 돔에서 그분이 말했어요. "서윤아, 7시에 네 입으로 말해라. 아니면 내가 말한다." 화를 내지도 않으셨어요. 그게 더 무서웠어요. 다음 달이면 물마루가 국가모델이 되는데, 제가 쌓은 전부가… 정신을 차려보니 회전축이 제 손에 있었어요.</p>
      <p>녹음기에 소장님 목소리가 있었어요. 그 목소리면 모두가 그분이 살아 계신다고 믿을 거라 생각했죠. 저는 예보관인데요. 그 시각에 눈이 지나간다는 걸, 제 손으로 브리핑 메모에 써놓고도 잊었어요.</p>
      <p>바람이 멎은 하늘 아래에서, 죽은 사람이 강풍을 말하고 있었던 거예요.</p>
    </div>` :
    `<div class="lbl">미해결 · 12:00</div><h1>가람이 지나간 뒤</h1>
    <div class="prose"><p class="lead">12시 4분, 해경 헬기가 내렸다. 사건은 '강풍 속 관측 중 사다리 추락에 의한 사고사 가능성'으로 정리되었다.</p>
    <p>강서윤은 헬기에 오르며 바다를 한 번 돌아보았다. 한 달 뒤, AI 예보모델 '물마루'가 국가 현업모델로 채택되었다. 발표 자리에서 그녀는 이 모델을 스승 윤태석에게 바친다고 말했다.</p>
    <p>그날 밤 가랑도에서 실제로 일어난 일은 이렇다.</p></div>`;
  const epi = win ? `<div class="prose"><p>그날 오후, 윤가을은 조막례에게서 아버지의 편지를 받았다. 백승우는 본청으로 돌아가 2027년 9월 11일의 메모에 대해 진술서를 썼다. 민재호는 관측야장 날조로 징계를 받았지만, 백업 테이프를 복원한 공으로 증인석에 섰다. 오한나의 다큐는 7시 생중계 대신 이듬해 봄에 방송되었다.</p>
    <p>한 달 뒤, 기상청은 2027년 태풍 '하늬' 예보 과정 재조사를 발표했다. 서포항 방파제 기념비에 스물세 개의 이름이 다시 새겨졌고, 그 아래 한 줄이 더해졌다.</p>
    <p class="lead">"바람은 예보할 수 있어도, 침묵은 예보할 수 없다."</p></div>` : "";
  $("modal").hidden = true;
  const T = $("title");
  T.hidden = false;
  T.innerHTML = `<div class="t-wrap end" style="max-width:820px">${winHead}${ansTable}
    <h3 style="font-family:var(--display);font-size:20px;margin:24px 0 4px">그날 밤의 진짜 시간표</h3>
    <ol class="timeline">${TIMELINE.map(([t, d, k]) => `<li class="${k ? "key" : ""}"><time>${t}</time><span>${d}</span></li>`).join("")}</ol>
    ${epi}
    <div class="row" style="margin:20px 0 40px"><button class="btn primary" id="again">새 조사 시작</button></div></div>`;
  T.scrollTop = 0;
  $("again").onclick = () => showTitle();
}

/* ---------- 환경음 (Web Audio로 합성) ---------- */

/* ---------- 렌더 루프 ---------- */
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let C1, C2;

    if (d <= stp) { p.x = tg.x; p.z = tg.z; mv.path.shift(); } else { p.x += dx / d * stp; p.z += dz / d * stp; moving = true; mv.face = Math.atan2(dx, dz); }

function loop() {
  requestAnimationFrame(loop);
  const rawDt = G.clock.getDelta(), dt = Math.min(rawDt, 0.05), t = G.clock.elapsedTime;

  G.lamps.forEach((L, i) => {
    let k = 1.15 - day * 0.45;

    L.pl.intensity = L.base * k; L.bulbM.color.copy(L.bulbBase).multiplyScalar(k);

  ou.fogColor.value.copy(G.scene.fog.color); ou.fogDensity.value = G.scene.fog.density;
  const ru = G.rainMat.uniforms; ru.uTime.value = t; ru.uStorm.value = reduceMotion ? storm * 0.3 : storm; ru.uWind.value = 3 + storm * 9; ru.fogColor.value.copy(G.scene.fog.color); ru.fogDensity.value = G.scene.fog.density;

  const blink = Math.sin(t * 3) > 0.25;
  if (G.beacon) { G.beacon.visible = blink; G.beaconLight.intensity = blink ? 1.3 : 0; }

  if (G.dome) G.dome.rotation.y = t * 0.08;
  if (G.screenTex && (G.scrN = (G.scrN || 0) + 1) % 3 === 0) { const tx = G.screenTex[0]; drawScreen(0, tx.image.getContext("2d"), tx.image.width, tx.image.height, t); tx.needsUpdate = true; }
  if (G.steam) G.steam.forEach(s => { const k = ((t * 0.35 + s.userData.ph) % 1); s.position.set(G.potPos.x + Math.sin(k * 6 + s.userData.ph * 9) * 0.06, G.potPos.y + k * 0.8, G.potPos.z + k * 0.1); s.scale.setScalar(0.12 + k * 0.4); s.material.opacity = 0.28 * Math.sin(k * Math.PI); });
  if (G.wires && !reduceMotion) G.wires.forEach(w => { const { a, b, o } = w.userData.sway, pa = w.geometry.attributes.position; for (let k = 0; k <= 16; k++) { const s = k / 16, sag = Math.sin(s * Math.PI); pa.setZ(k, a[1] + (b[1] - a[1]) * s + sag * Math.sin(t * 2.4 + o * 4) * 0.12 * storm); } pa.needsUpdate = true; });

  G.pawns.forEach(pw => { pw.lookAt = null; stepMover(pw, dt, t, pw.speed); });
  const pw = p && G.pawns[state.turn];
  if (pw) {
    const gp = pw.g.position; G.ring.position.set(gp.x, FLOOR_Y + 0.02, gp.z); G.ringGlow.position.set(gp.x, FLOOR_Y + 0.015, gp.z);
    const col = new THREE.Color(cur().color); G.ring.material.color.copy(col).multiplyScalar(2.5); G.ringGlow.material.color.copy(col);
    G.ring.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
    const fy = pw.g.rotation.y; G.torch.position.set(gp.x + Math.sin(fy) * 0.15, 0.95, gp.z + Math.cos(fy) * 0.15); G.torch.target.position.set(gp.x + Math.sin(fy) * 2.2, 0, gp.z + Math.cos(fy) * 2.2);

  c.position.set(o.target.x + o.r * Math.sin(o.phi) * Math.sin(o.theta), o.target.y + o.r * Math.cos(o.phi), o.target.z + o.r * Math.sin(o.phi) * Math.cos(o.theta));
  if (G.shake > 0 && !reduceMotion) { G.shake -= dt; const s = G.shake * 0.12; c.position.x += (Math.random() - 0.5) * s; c.position.y += (Math.random() - 0.5) * s; }
  c.lookAt(o.target);
  sfxUpdate(storm, t);

}
